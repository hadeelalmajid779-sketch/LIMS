{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="card border-danger shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">

            <div class="text-center mb-3">
                <i class="bi bi-exclamation-triangle text-danger"
                   style="font-size: 2.5rem;"></i>

                <h4 class="text-danger mt-2">
                    Confirm Test Result Deletion
                </h4>
            </div>

            <p class="text-center">
                Are you sure you want to delete this test result?
            </p>

            <div class="alert alert-warning">
                Please confirm before proceeding. Deleting the result may affect the associated laboratory record.
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i>
                        Confirm Deletion
                    </button>

                    <a href="{% url 'core:patienttest_detail' result.patienttest.id %}"
                       class="btn btn-secondary">
                       Cancel and Go Back
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
